# Canonical index for the `arithmetic` repo.
#
# Scope: CLASS 2 STRUCTURAL READINGS ONLY. This repo makes no quantitative
# predictions, derives no constants, and adds no scorecard rows. It is a
# federated sibling of nickjoven/harmonics; the substrate of record for all
# framework concepts is harmonics, not this file. See README.md and CLAUDE.md.
#
# Updated: 2026-06-03

repo:
  name: arithmetic
  role: "Class 2 structural readings (vocabulary studies) of external objects"
  federation:
    sibling_of: "nickjoven/harmonics"
    substrate_of_record: "harmonics (.ket content-addressed store)"
    staged_in: "harmonics#210"
  invariant: >
    Everything here is Class 2 — a noted structural correspondence with no
    claim of derivation, no prediction, and no new framework constant. A
    reading that claims the framework derives its object is a bug, not a
    result. Per-class definitions: harmonics:numerology_inventory.md.

# Concepts borrowed from harmonics (referenced, NOT re-derived here).
# Listed so a reader knows exactly what this repo takes on faith from the
# substrate. None of these is established BY this repo.
imported_from_harmonics:
  forced_primes:
    value: "(q₂, q₃) = (2, 3)"
    cross_link: "q₂² − 1 = q₃ , q₃² − 1 = q₂³"
    source: "harmonics:farey_partition.md"
  minimum_alphabet:
    value: "integers Z, mediant (a+c)/(b+d), fixed-point x=f(x), parabola x²+μ=0"
    source: "harmonics:minimum_alphabet.md"
  mediant_is_psl2z:
    value: "mediant = generator of the PSL(2,ℤ) Farey action on P¹(Q)"
    source: "harmonics:canonical_glossary.md §5"

# The studies. Each is Class 2; each ships a pure-Python check that prints
# every load-bearing number in its note.
studies:
  collatz_minimal_chaos:
    object: "Collatz map 3n+1 (and its rational extension on the Stern–Brocot tree)"
    class: 2
    reading: >
      Collatz is the minimal discrete-chaos competition between the forced
      primes: expansion ×q₃ on odd steps, contraction ÷q₂ on even steps.
    mechanism:
      contraction_boundary: "q·n+1 contracts iff q < q₂² = 4; only odd q in (1,4) is q=3"
      collatz_position: "q₃ = q₂² − 1 → 3n+1 is the boundary case, one unit under the wall"
      rate: "per-odd-cycle multiplier q₃/q₂² = 3/4 (E[v₂(3n+1)] = q₂ = 2)"
      plus_one: "the '+1' is the mediant of 3p/q with the tree root 1/1; restores ÷q₂ on both coordinates"
      integers_are_boundary: "q=1 = rightmost Stern–Brocot branch = minimal gcd cancellation = hard case"
      unique_cycle: "only integer cycle is {1,2}; q₃^a = q₂^b has no positive solution"
    measured:
      E_v2_3n1: 1.9976          # predicted q₂ = 2
      per_odd_cycle_multiplier: 0.747   # predicted q₃/q₂² = 0.75
      int_3n1_reach_one: "1998 / 1998 over n=2..1999"
      int_5n1_diverge: "1742 / 1998 (boundary q=5 > 4 predicts non-convergence)"
      rational_convergence: "979 reduced fractions p,q≤40 → {1/1,2/1}, max 74 steps"
    does_not_show:
      - "does NOT prove Collatz — every-orbit vs almost-every (Tao 2019) is the open conjecture"
      - "does NOT derive q₂, q₃ — they are imported from harmonics"
      - "rate 3/4 is the E[v₂]=2 heuristic, exact only in expectation; the BOUNDARY q<q₂² is the exact content"
    note: "collatz/minimal_chaos.md"
    check: "collatz/minimal_chaos.py"
    status: "complete"

# Staged but not yet authored in this repo (see harmonics#210). Each would
# enter as Class 2 and must carry its own guard rails.
planned:
  ramanujan_pi:
    object: "Ramanujan 1914 series for 1/π"
    reading: "home shared (level Γ₀(6)), address disjoint (no CM discriminant); structure-fixer, not moduli-fixer"
    status: "exists in harmonics branch; not yet ported here"
  farey_riemann:
    object: "Farey / Stern–Brocot tree under Ramanujan / Collatz / Riemann"
    reading: "RH leg anchored on Franel–Landau (1924): RH ⟺ Farey equidistribution"
    status: "not yet authored"
